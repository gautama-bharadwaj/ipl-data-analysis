name: Refresh data from Cricsheet

# Run by hand (Actions tab -> Refresh data -> Run workflow), e.g. after each IPL season.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - run: python scripts/build_tables.py
      - run: python scripts/build_site_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add dataset docs/data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh IPL data from Cricsheet"
          git push
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref ${{ github.ref_name }}
